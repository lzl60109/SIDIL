# @package _global_

name: BC_${env.agent}UMaze
method: bc
seed: 1

logger:
  wandb:
    project: Maze
    name: ${name}

env:
  agent: Point
  id: ${.agent}RegionUMaze-v0
  init: &env_defaults {}
  wrappers: []

test:
  n_envs: 20
  n_ep: 100
  env:
    _target_: tianshou.env.DummyVectorEnv
    norm_obs: false
  collector:
    _target_: src.data.collector.TqdmPosCollector

eval:
  n_envs: 20
  n_ep: 100
  env:
    _target_: tianshou.env.ShmemVectorEnv
    norm_obs: ${test.env.norm_obs}
  env_kwargs:
    <<: *env_defaults
    reset_noise_scale: 0.1
  collector:
    _target_: src.data.collector.TqdmPosCollector

policy:
  batch_size: 256
  train:
    n_epoch: 800
    step_per_epoch: 250
  bc:
    demo_ratio: 1


demonstration:
  n_ep: 20
  mode: stitching
  # path: ${work_dir}/data/demos/maze/GoalPointRegionUMaze-v2/${.n_ep}episodes.pkl
  new_path: ${work_dir}/data/demos/maze/GoalPointRegionUMaze-v2/GoalPointRegionUMaze_vae_new_traces_20_200.pickle
  path: ${work_dir}/data/demos/maze/GoalPointRegionUMaze-v2/GoalPointRegionUMaze_aug_trajectories_20_200_0.9.pkl
  repeat: 1
  buffer:
    _target_: tianshou.data.ReplayBuffer
    size: 1000000

defaults:
  - override /policy: bc_stitching
