# @package _global_

name: BC_AdroitPen
method: bc
seed: 1

logger:
  wandb:
    project: Adroit
    name: ${name}

env:
  id: AdroitPen-v0
  init: &env_defaults
    terminate_on_success: true
  wrappers: []

test:
  n_envs: 20
  n_ep: 1000
  env:
    _target_: tianshou.env.DummyVectorEnv
    norm_obs: false
  collector:
    _target_: src.data.collector.TqdmPosCollector

eval:
  n_envs: 20
  n_ep: 1000
  env:
    _target_: tianshou.env.ShmemVectorEnv
    norm_obs: ${test.env.norm_obs}
  env_kwargs:
    <<: *env_defaults
    random_start: false
  collector:
    _target_: src.data.collector.TqdmPosCollector

policy:
  batch_size: 64
  train:
    n_epoch: 600
    step_per_epoch: 50
  bc:
    demo_ratio: 0.6

demonstration:
  n_ep: 20
  mode: stitching
  path: ${work_dir}/data/demos/adroit/AdroitPen-v0/${.n_ep}episodes.pkl
  new_path: ${work_dir}/data/demos/adroit/AdroitPen-v0/AdroitPen_vae_new_traces_20_200.pickle
  # path: ${work_dir}/data/demos/adroit/AdroitPen-v0/AdroitPen_aug_trajectories_10_100_0.9.pkl
  repeat: 1
  buffer:
    _target_: tianshou.data.ReplayBuffer
    size: 1000000

defaults:
  - override /policy: bc_stitching
